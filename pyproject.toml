[project]
name = "agentic-it-desk-ai-helpdesk-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Amardeep Kumar", email = "amar1947deep@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.4",
    "langchain-openai>=1.7.3",
    "langchain-pinecone>=0.2.13",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "openai>=3.42.1",
    "pinecone>=7.3.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentic-it-desk-ai-helpdesk-agent = "agentic_it_desk_ai_helpdesk_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
